<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المباحث الجنائية - سجل التحقيقات</title>
  <style>
    :root {
      --desk-dark: #0a0d13;
      --card-bg: #141923;
      --border-color: #273043;
      --accent: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.2);
      --danger: #e63946;
      --success: #2a9d8f;
      --text: #f0f6fc;
      --muted: #8b949e;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    body {
      background-color: var(--desk-dark);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 35px 35px, 35px 35px;
      color: var(--text);
      line-height: 1.6;
      padding: 16px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      max-width: 920px;
      width: 100%;
    }
    .officer-bar {
      background: #11151f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .rank-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rank-badge {
      background: #1c2230;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .score-badge {
      background: #1c2230;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .score-val {
      font-weight: bold;
      color: var(--accent);
    }
    .cases-nav {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin-bottom: 15px;
    }
    .case-cell {
      background: #131822;
      border: 1px solid var(--border-color);
      color: var(--muted);
      padding: 9px 0;
      text-align: center;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    .case-cell.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .case-cell.solved {
      background: rgba(42, 157, 143, 0.2);
      border-color: var(--success);
      color: var(--success);
    }
    .case-cell.locked {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .case-header {
      background: linear-gradient(135deg, #161c28 0%, #11151f 100%);
      border-right: 4px solid var(--accent);
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 15px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      border-left: 1px solid var(--border-color);
    }
    .case-header h2 {
      font-size: 1.25rem;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .case-header p {
      font-size: 0.92rem;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .tabs-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .tab-btn {
      flex: 1;
      background: #11151f;
      border: 1px solid var(--border-color);
      color: var(--muted);
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: #1a202d;
      border-color: var(--accent);
      color: var(--accent);
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .grid-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 14px;
    }
    .card h4 {
      color: #fff;
      margin-bottom: 6px;
      font-size: 0.95rem;
      border-bottom: 1px dashed rgba(255,255,255,0.08);
      padding-bottom: 4px;
    }
    .card p {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .suspect-card {
      border-right: 3px solid var(--accent);
    }
    .suspect-quote {
      background: #0c0f16;
      padding: 8px;
      border-radius: 4px;
      margin-top: 8px;
      font-style: italic;
      color: #e2e8f0;
      font-size: 0.82rem;
      border-right: 2px solid var(--danger);
    }
    .verdict-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    select {
      width: 100%;
      background: #0c0f16;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 11px;
      border-radius: 4px;
      font-size: 0.9rem;
      outline: none;
    }
    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #a8232e, #7a151e);
      color: #fff;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .submit-btn:hover {
      opacity: 0.9;
    }
    #verdict-modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 10, 0.85);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 100;
    }
    .modal-box {
      background: #141923;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .modal-box h3 {
      font-size: 1.35rem;
      margin-bottom: 10px;
    }
    .modal-box p {
      color: #cbd5e1;
      font-size: 0.92rem;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .modal-box button {
      background: var(--accent);
      color: #0d1117;
      font-weight: bold;
      border: none;
      padding: 10px 22px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="officer-bar">
    <div class="rank-info">
      <span class="rank-badge" id="player-rank">مساعد باحث جنائي</span>
      <span style="font-size: 0.85rem; color: var(--muted);" id="tier-indicator">المستوى الأول: القضايا الجنائية الكبرى</span>
    </div>
    <div class="score-badge">الرصيد: <span class="score-val" id="player-score">0</span> نقطة</div>
  </div>

  <div class="cases-nav" id="cases-nav"></div>

  <div class="case-header">
    <h2 id="case-title">جاري فتح ملف القضية...</h2>
    <p id="case-brief"></p>
  </div>

  <div class="tabs-nav">
    <button class="tab-btn active" onclick="showTab('clues')">الأدلة المادية (5) 🔎</button>
    <button class="tab-btn" onclick="showTab('suspects')">المشتبه بهم (4) 👥</button>
    <button class="tab-btn" onclick="showTab('verdict')">إصدار الاتهام ⚖️</button>
  </div>

  <div id="tab-clues" class="tab-content active">
    <div class="grid-cards" id="clues-list"></div>
  </div>

  <div id="tab-suspects" class="tab-content">
    <div class="grid-cards" id="suspects-list"></div>
  </div>

  <div id="tab-verdict" class="tab-content">
    <div class="verdict-panel">
      <div class="form-group">
        <label>المتهم الحقيقي بالتدبير أو القتل:</label>
        <select id="culprit-select"></select>
      </div>
      <div class="form-group">
        <label>الدليل القاطع الذي يكشف كذبته:</label>
        <select id="proof-select"></select>
      </div>
      <button class="submit-btn" onclick="processVerdict()">إحالة المتهم للمحاكمة (+100 / -30)</button>
    </div>
  </div>
</div>

<div id="verdict-modal">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
    <button onclick="closeModal()">متابعة</button>
  </div>
</div>

        { n: "د. إيهاب (أستاذ العقاقير)", b: "صاحب قرار الترقية المرفوض ومفتاحه المكرر مكسور الطرف.", q: "كنت جالساً بين الأساتذة ولم أقترب من منضدة التكريم مطلقاً!" },
        { n: "رأفت (أمين المعمل المركزي)", b: "المسؤول عن خزانة السموم ومفتاحه الأصلي سليم.", q: "وجدت قفل الخزانة معطوباً بالكسر وأبلغت إدارة الكلية صباحاً." },
        { n: "علا (المعيدة المشرفة)", b: "رتبت كؤوس العصير على المنصة.", q: "وضعت الكؤوس كما تسلمتها وذهبت لتنظيم طابور الخريجين." },
        { n: "د. شريف (وكيل الكلية)", b: "يطمح لمنصب العميد خلفاً للضحية.", q: "كنت ألقي كلمة الافتتاح بالمسرح أمام الجميع طوال الحفل." }
      ],
      culprits: [
        { val: "ehab", name: "د. إيهاب (أستاذ العقاقير)" },
        { val: "raafat", name: "رأفت (أمين المعمل)" },
        { val: "ola", name: "علا (المعيدة)" },
        { val: "sherif_dean", name: "د. شريف (وكيل الكلية)" }
      ],
      proofs: [
        { val: "broken_key_juice", name: "سن المفتاح المكسور بخزانة السموم وبقعة العصير على كمه" },
        { val: "micro_syringe", name: "السرنجة الدقيقة خلف الستار" },
        { val: "rejection_paper", name: "قرار رفض الترقية" },
        { val: "batch_num", name: "رقم تشغيلة عقار الديجوكسين" },
        { val: "podium_tray", name: "صينية الكؤوس التكريمية" }
      ],
      ansCulprit: "ehab",
      ansProof: "broken_key_juice",
      explain: "د. إيهاب انتقم لرفض ترقيته وسرق الديجوكسين بمفتاح مقلد انكسر طرفه بالقفل، ثم حقن العصير بالسرنجة، وفضحه تطابق سن المفتاح مع قطرات العصير المسموم على كمه!"
    }
  ];

  let player = JSON.parse(localStorage.getItem('det_save_handcrafted')) || {
    score: 0,
    activeCaseId: 1,
    solvedCases: []
  };

  function saveGame() {
    localStorage.setItem('det_save_handcrafted', JSON.stringify(player));
  }

  function updateStatus() {
    const isPromoted = player.solvedCases.length >= 10;
    document.getElementById('player-rank').innerText = isPromoted ? "ملازم تحقيقات (مُرقّى) 🎖️" : "مساعد باحث جنائي";
    document.getElementById('player-score').innerText = player.score;
  }

  function renderCasesNav() {
    const nav = document.getElementById('cases-nav');
    nav.innerHTML = '';
    HANDMADE_CASES.forEach((c) => {
      const isSolved = player.solvedCases.includes(c.id);
      const isAvailable = c.id === 1 || player.solvedCases.includes(c.id - 1);

      const cell = document.createElement('div');
      cell.className = `case-cell ${c.id === player.activeCaseId ? 'active' : ''} ${isSolved ? 'solved' : ''} ${!isAvailable && !isSolved ? 'locked' : ''}`;
      cell.innerText = c.id;
      cell.onclick = () => {
        if (isAvailable || isSolved) {
          loadCase(c.id);
        } else {
          alert('حل القضية السابقة أولاً لفتح هذا الملف!');
        }
      };
      nav.appendChild(cell);
    });
  }

  function loadCase(id) {
    player.activeCaseId = id;
    renderCasesNav();

    const c = HANDMADE_CASES.find(item => item.id === id);
    document.getElementById('case-title').innerText = c.title;
    document.getElementById('case-brief').innerText = c.brief;

    document.getElementById('clues-list').innerHTML = c.clues.map(clue => `
      <div class="card">
        <h4>${clue.t}</h4>
        <p>${clue.d}</p>
      </div>
    `).join('');

    document.getElementById('suspects-list').innerHTML = c.suspects.map(s => `
      <div class="card suspect-card">
        <h4>${s.n}</h4>
        <p><strong>الخلفية:</strong> ${s.b}</p>
        <div class="suspect-quote">"${s.q}"</div>
      </div>
    `).join('');

    document.getElementById('culprit-select').innerHTML = '<option value="">-- حدد المتهم الحقيقي --</option>' + 
      c.culprits.map(opt => `<option value="${opt.val}">${opt.name}</option>`).join('');

    document.getElementById('proof-select').innerHTML = '<option value="">-- حدد الدليل الحاسم --</option>' + 
      c.proofs.map(opt => `<option value="${opt.val}">${opt.name}</option>`).join('');

    showTab('clues');
  }

  function showTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

    const idx = tab === 'clues' ? 0 : (tab === 'suspects' ? 1 : 2);
    document.querySelectorAll('.tab-btn')[idx].classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
  }

  function processVerdict() {
    const c = HANDMADE_CASES.find(item => item.id === player.activeCaseId);
    const chosenCulprit = document.getElementById('culprit-select').value;
    const chosenProof = document.getElementById('proof-select').value;

    if (!chosenCulprit || !chosenProof) {
      alert('اختر المتهم والدليل أولاً!');
      return;
    }

    const modal = document.getElementById('verdict-modal');
    const title = document.getElementById('modal-title');
    const desc = document.getElementById('modal-desc');

    if (chosenCulprit === c.ansCulprit && chosenProof === c.ansProof) {
      if (!player.solvedCases.includes(c.id)) {
        player.score += 100;
        player.solvedCases.push(c.id);

        if (player.solvedCases.length === 10) {
          title.innerText = "ترقية عسكرية مستحقة! 🎖️";
          title.style.color = "var(--accent)";
          desc.innerHTML = `أغلقت جميع قضايا المستوى الأول بنجاح وحصلت على 1000 نقطة!<br><strong>مبروك ترقيتك إلى رتبة: ملازم تحقيقات</strong>.`;
          saveGame();
          updateStatus();
          renderCasesNav();
          modal.style.display = 'flex';
          return;
        }
      }

      title.innerText = "استنتاج جنائي بارع (+100 نقطة) ⚖️";
      title.style.color = "var(--success)";
      desc.innerHTML = c.explain;
    } else {
      player.score = Math.max(0, player.score - 30);
      title.innerText = "استنتاج خاطئ (-30 نقطة) ❌";
      title.style.color = "var(--danger)";
      desc.innerText = "الدليل المختار لا يدحض حجة غياب المتهم أو أن المتهم ليس هو الفاعل الحقيقي. تم خصم 30 نقطة.";
    }

    saveGame();
    updateStatus();
    renderCasesNav();
    modal.style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('verdict-modal').style.display = 'none';
  }

  updateStatus();
  renderCasesNav();
  loadCase(player.activeCaseId);
</script>
</body>
</html>
